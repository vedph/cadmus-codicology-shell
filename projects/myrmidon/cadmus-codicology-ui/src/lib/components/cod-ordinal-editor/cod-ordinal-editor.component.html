<div class="form-row">
  <mat-form-field appearance="fill" class="nr">
    <mat-label>value</mat-label>
    <input
      matInput
      type="number"
      [formField]="form.value"
      (keydown.enter)="onEnterKey($event)"
    />
  </mat-form-field>

  <!-- warning -->
  @if (
    form.value().value() &&
    ordinal()?.warnValues?.includes(form.value().value()!)
  ) {
    <span>
      <mat-icon class="mat-warn">warning</mat-icon>
    </span>
  }

  <!-- buttons -->
  <div>
    <button
      type="button"
      mat-icon-button
      matTooltip="Discard changes"
      (click)="cancel()"
    >
      <mat-icon class="mat-warn">clear</mat-icon>
    </button>
    <button
      type="button"
      mat-icon-button
      matTooltip="Accept changes"
      [disabled]="form().invalid() || !form().dirty()"
      (click)="save()"
    >
      <mat-icon class="mat-primary">check_circle</mat-icon>
    </button>
  </div>
</div>
