<div (keydown.enter)="onEnterKey($event)">
  <!-- features -->
  @if (featureFlags().length) {
    <div>
      <fieldset>
        <legend>features</legend>
        <cadmus-ui-flag-set
          [flags]="featureFlags()"
          [checkedIds]="form.features().value()"
          (checkedIdsChange)="onFeatureCheckedIdsChange($event)"
        />
      </fieldset>
    </div>
  }
  <!-- note -->
  <div>
    <mat-form-field class="long-text">
      <mat-label>note</mat-label>
      <textarea matInput [formField]="form.note" rows="3"></textarea>
      @if (form.note().getError("maxLength") && (form.note().dirty() || form.note().touched())) {
        <mat-error>note too long</mat-error>
      }
    </mat-form-field>
  </div>
  <!-- scoped notes -->
  @if (scopes().length) {
    <div>
      <fieldset>
        <legend>scoped notes</legend>
        <cadmus-ui-note-set
          [set]="initialNoteSet()"
          (setChange)="onSetChange($event)"
        />
      </fieldset>
    </div>
  }
  <!-- buttons -->
  <div>
    <button
      type="button"
      mat-icon-button
      matTooltip="Discard changes"
      (click)="cancel()"
    >
      <mat-icon class="mat-warn">clear</mat-icon>
    </button>
    <button
      type="button"
      mat-icon-button
      matTooltip="Accept changes"
      [disabled]="form().invalid() || !form().dirty()"
      (click)="save()"
    >
      <mat-icon class="mat-primary">check_circle</mat-icon>
    </button>
  </div>
</div>
