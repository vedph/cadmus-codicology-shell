<div (keydown.enter)="onEnterKey($event)">
  <div>
    <!-- range -->
    <cadmus-cod-location
      label="ranges"
      [required]="true"
      [location]="form.ranges().value()"
      (locationChange)="onLocationChange($event)"
    />
  </div>
  <!-- chronotope -->
  <div>
    <fieldset>
      <legend>chronotope</legend>
      <cadmus-refs-asserted-chronotope
        [tagEntries]="ctTagEntries()"
        [assTagEntries]="assTagEntries()"
        [refTagEntries]="refTagEntries()"
        [refTypeEntries]="refTypeEntries()"
        [lookupProviderOptions]="lookupProviderOptions()"
        [chronotope]="form.chronotope().value() || undefined"
        (chronotopeChange)="onChronotopeChange($event!)"
      />
    </fieldset>
  </div>
  <!-- note -->
  <div style="margin-top: 8px">
    <mat-form-field class="long-text">
      <mat-label>note</mat-label>
      <input matInput [formField]="form.note" />
      @if (form.note().getError("maxLength") && (form.note().dirty() || form.note().touched())) {
        <mat-error>note too long</mat-error>
      }
    </mat-form-field>
  </div>

  <!-- buttons -->
  <div>
    <button
      type="button"
      mat-icon-button
      matTooltip="Discard changes"
      (click)="cancel()"
    >
      <mat-icon class="mat-warn">clear</mat-icon>
    </button>
    <button
      type="button"
      mat-icon-button
      matTooltip="Accept changes"
      [disabled]="form().invalid() || !form().dirty()"
      (click)="save()"
    >
      <mat-icon class="mat-primary">check_circle</mat-icon>
    </button>
    palimpsest
  </div>
</div>
